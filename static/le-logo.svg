  <text x="56" y="22" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#1b4332" letter-spacing="0.5">Language</text>
  <text x="56" y="40" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="400" fill="#40916c" letter-spacing="2">ENGINE</text>
