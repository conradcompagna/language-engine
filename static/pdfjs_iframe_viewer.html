<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF.js Iframe Viewer</title>
  <link rel="stylesheet" href="/static/vendor/pdfjs/pdf_viewer.min.css">
  <style>
    :root {
      --ui-h: 24px;
      --ui-side-w: 24px;
      --ui-search-h: calc(var(--ui-h) - 4px);
      --ui-pill-radius: 12px;
      --ui-inner-radius: 10px;
      --ui-bg: rgba(17, 24, 39, 0.96);
      --ui-border: 1px solid rgba(255, 255, 255, 0.42);
      --ui-text: #f3f4f6;
      --ui-gap: 6px;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
      font-family: system-ui, sans-serif;
    }
    #pdfContainer {
      position: absolute;
      inset: 0;
      overflow: auto;
      background: #525659;
      z-index: 1;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #pdfContainer::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    #pdfContainer.drag-mode {
      cursor: grab;
    }
    #pdfContainer.drag-mode.dragging {
      cursor: grabbing;
    }
    #pdfContainer .textLayer,
    #pdfContainer .textLayer * {
      user-select: none;
      -webkit-user-select: none;
    }
    #pdfContainer .textLayer span {
      pointer-events: none;
    }
    #pdfContainer.source-inspector-active .textLayer,
    #pdfContainer.source-inspector-active .textLayer * {
      user-select: text;
      -webkit-user-select: text;
    }
    #pdfContainer.source-inspector-active .textLayer span {
      pointer-events: auto;
    }
    #pdfContainer.source-inspector-active .textLayer ::selection {
      background: transparent;
      color: inherit;
    }
    #pdfViewer {
      width: 100%;
      height: 100%;
    }
    #pdfViewer .page {
      box-shadow: none;
    }

    #pageCornerBadge {
      position: fixed;
      top: 10px;
      left: 12px;
      z-index: 40;
      height: var(--ui-h);
      box-sizing: border-box;
      min-width: 80px;
      padding: 0 10px;
      border-radius: var(--ui-pill-radius);
      border: var(--ui-border);
      background: var(--ui-bg);
      color: var(--ui-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      user-select: none;
      pointer-events: none;
    }

    #topRightControls {
      position: fixed;
      top: 10px;
      right: 50px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: var(--ui-gap);
    }
    #pdfModeBar,
    #pdfZoomBar,
    #pdfSearchBar {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--ui-gap);
      height: var(--ui-h);
      box-sizing: border-box;
      padding: 0 6px;
      border: var(--ui-border);
      border-radius: var(--ui-pill-radius);
      background: var(--ui-bg);
    }
    #pdfZoomBar {
      flex: 0 0 auto;
    }
    #pdfModeBar {
      flex: 0 0 auto;
    }
    #pdfSearchBar {
      flex: 0 0 auto;
    }
    #pdfSearchDropdown {
      position: fixed;
      top: calc(10px + var(--ui-h) + 8px);
      right: 50px;
      z-index: 61;
      width: 420px;
      max-width: calc(100vw - 70px);
      max-height: 250px;
      overflow: auto;
      border: var(--ui-border);
      border-radius: var(--ui-pill-radius);
      background: rgba(17, 24, 39, 0.96);
      color: var(--ui-text);
    }
    #pdfSearchDropdown[hidden] {
      display: none;
    }
    #pdfSearchDropdownMeta {
      padding: 6px 10px;
      border-bottom: var(--ui-border);
      font-size: 11px;
      line-height: 1.25;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pdfSearchDropdownList {
      display: block;
    }
    .search-result-row {
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: var(--ui-text);
      text-align: left;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.3;
    }
    .search-result-row:last-child {
      border-bottom: 0;
    }
    .search-result-row[disabled] {
      cursor: default;
      color: #cbd5e1;
    }
    .search-result-row.active {
      background: rgba(14, 165, 233, 0.22);
    }
    .search-result-page {
      display: inline-block;
      min-width: 54px;
      color: #93c5fd;
      font-variant-numeric: tabular-nums;
    }
    .search-result-mark {
      background: rgba(56, 189, 248, 0.38);
      color: #ffffff;
      border-radius: 3px;
      padding: 0 1px;
    }
    #pdfSearchInput {
      width: 220px;
      height: var(--ui-search-h);
      box-sizing: border-box;
      border: var(--ui-border);
      border-radius: var(--ui-inner-radius);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      font-size: 12px;
      line-height: 1;
      padding: 0 10px;
      outline: none;
    }
    #pdfSearchInput:focus {
      border-color: rgba(14, 165, 233, 0.95);
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
    }
    #pdfSearchCount {
      min-width: 72px;
      height: var(--ui-search-h);
      box-sizing: border-box;
      border: var(--ui-border);
      border-radius: var(--ui-inner-radius);
      background: rgba(255, 255, 255, 0.12);
      color: var(--ui-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      padding: 0 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #pdfSearchCount[data-state="pending"] {
      opacity: 0.85;
    }
    #pdfSearchCount[data-state="no-results"] {
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.65);
      background: rgba(127, 29, 29, 0.45);
    }
    .search-btn {
      width: var(--ui-search-h);
      height: var(--ui-search-h);
      box-sizing: border-box;
      border: var(--ui-border);
      border-radius: var(--ui-inner-radius);
      background: var(--ui-bg);
      color: var(--ui-text);
      font-size: 11px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-reset-btn {
      width: auto;
      min-width: calc(var(--ui-search-h) + 26px);
      padding: 0 8px;
    }
    .mode-toggle-btn {
      width: var(--ui-search-h);
      min-width: var(--ui-search-h);
      padding: 0;
      font-size: 13px;
      text-transform: none;
      font-family: "Segoe UI Symbol", "Noto Sans Symbols2", "Arial Unicode MS", sans-serif;
    }
    .nav-btn {
      width: 100%;
      height: var(--ui-h);
      box-sizing: border-box;
      border: var(--ui-border);
      border-radius: var(--ui-inner-radius);
      background: var(--ui-bg);
      color: var(--ui-text);
      font-size: 12px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #pageNavigator {
      position: fixed;
      top: 10px;
      bottom: 10px;
      right: 10px;
      width: var(--ui-side-w);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #navTrack {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      box-sizing: border-box;
      border-radius: var(--ui-pill-radius);
      border: var(--ui-border);
      background: rgba(17, 24, 39, 0.9);
      cursor: pointer;
    }
    #navThumb {
      position: absolute;
      left: 3px;
      right: 3px;
      top: 0;
      height: 20px;
      border-radius: var(--ui-inner-radius);
      background: rgba(241, 245, 249, 0.96);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      cursor: grab;
      transform: translateY(0px);
      touch-action: none;
    }
    #navThumb.dragging {
      cursor: grabbing;
      background: #ffffff;
    }
    body.parent-chrome #pageCornerBadge,
    body.parent-chrome #topRightControls,
    body.parent-chrome #pdfSearchDropdown,
    body.parent-chrome #pageNavigator {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="pdfContainer">
    <div id="pdfViewer" class="pdfViewer"></div>
  </div>

  <div id="pageCornerBadge">1 / 1</div>

  <div id="topRightControls">
    <div id="pdfModeBar" aria-label="Interaction Mode">
      <button id="pdfModeToggle" class="search-btn mode-toggle-btn" type="button" aria-label="Toggle Drag Mode">✎</button>
    </div>
    <div id="pdfZoomBar" aria-label="Zoom Controls">
      <button id="pdfZoomIn" class="search-btn" type="button" aria-label="Zoom In">+</button>
      <button id="pdfZoomOut" class="search-btn" type="button" aria-label="Zoom Out">-</button>
      <button id="pdfZoomReset" class="search-btn zoom-reset-btn" type="button" aria-label="Reset Zoom">reset</button>
    </div>
    <div id="pdfSearchBar" aria-label="Search">
      <input id="pdfSearchInput" type="text" placeholder="Search in PDF" autocomplete="off" />
      <button id="pdfSearchPrev" class="search-btn" type="button" aria-label="Previous Match">↑</button>
      <button id="pdfSearchNext" class="search-btn" type="button" aria-label="Next Match">↓</button>
      <span id="pdfSearchCount" aria-live="polite" data-state="idle">0/0</span>
      <button id="pdfSearchClear" class="search-btn" type="button" aria-label="Clear Search">×</button>
    </div>
  </div>
  <div id="pdfSearchDropdown" hidden>
    <div id="pdfSearchDropdownMeta">Type to search</div>
    <div id="pdfSearchDropdownList"></div>
  </div>

  <div id="pageNavigator" aria-label="Page Navigator">
    <button id="navPrev" class="nav-btn" type="button" aria-label="Previous Page">▲</button>
    <div id="navTrack" aria-hidden="true">
      <div id="navThumb"></div>
    </div>
    <button id="navNext" class="nav-btn" type="button" aria-label="Next Page">▼</button>
  </div>

  <script src="/static/vendor/pdfjs/pdf.min.js"></script>
  <script src="/static/vendor/pdfjs/pdf_viewer.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var cacheId = params.get("cache_id") || "";
      var pdfUrl = params.get("pdf_url") || "";
      var sessionId = params.get("session_id") || "";
      var parentChrome = params.get("chrome") === "0";
      var appOrigin = window.location.origin;
      if (parentChrome && document.body) {
        document.body.classList.add("parent-chrome");
      }

      function post(type, extra) {
        var payload = {
          source: "pdfjs-iframe",
          type: type,
          sessionId: String(sessionId || "")
        };
        if (extra && typeof extra === "object") {
          for (var k in extra) {
            if (Object.prototype.hasOwnProperty.call(extra, k)) {
              payload[k] = extra[k];
            }
          }
        }
        window.parent.postMessage(payload, appOrigin);
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeSearchText(str) {
        return String(str || "").replace(/\s+/g, " ").trim();
      }

      if (!cacheId && !pdfUrl) {
        post("pdfjs-error", { error: "missing_pdf_source" });
        return;
      }
      if (!window.pdfjsLib) {
        post("pdfjs-error", { error: "pdfjs_missing" });
        return;
      }
      if (!window.pdfjsViewer || !window.pdfjsViewer.PDFSinglePageViewer) {
        post("pdfjs-error", { error: "pdfjs_viewer_missing" });
        return;
      }

      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "/static/vendor/pdfjs/pdf.worker.min.js";

      var pdfContainer = document.getElementById("pdfContainer");
      var pdfViewerEl = document.getElementById("pdfViewer");
      var pageBadge = document.getElementById("pageCornerBadge");
      var searchBar = document.getElementById("pdfSearchBar");
      var modeToggleBtn = document.getElementById("pdfModeToggle");
      var zoomOutBtn = document.getElementById("pdfZoomOut");
      var zoomResetBtn = document.getElementById("pdfZoomReset");
      var zoomInBtn = document.getElementById("pdfZoomIn");
      var searchInput = document.getElementById("pdfSearchInput");
      var searchPrev = document.getElementById("pdfSearchPrev");
      var searchNext = document.getElementById("pdfSearchNext");
      var searchCount = document.getElementById("pdfSearchCount");
      var searchClear = document.getElementById("pdfSearchClear");
      var searchDropdown = document.getElementById("pdfSearchDropdown");
      var searchDropdownMeta = document.getElementById("pdfSearchDropdownMeta");
      var searchDropdownList = document.getElementById("pdfSearchDropdownList");
      var navPrev = document.getElementById("navPrev");
      var navNext = document.getElementById("navNext");
      var navTrack = document.getElementById("navTrack");
      var navThumb = document.getElementById("navThumb");

      var viewerEventBus = new window.pdfjsViewer.EventBus();
      var pdfLinkService = new window.pdfjsViewer.PDFLinkService({ eventBus: viewerEventBus });
      var pdfFindController = new window.pdfjsViewer.PDFFindController({
        eventBus: viewerEventBus,
        linkService: pdfLinkService
      });
      var nullL10n = window.pdfjsViewer.NullL10n || {
        get: function (_key, _args, fallback) { return Promise.resolve(fallback || ""); },
        getLanguage: function () { return Promise.resolve("en-us"); },
        getDirection: function () { return Promise.resolve("ltr"); },
        translate: function () { return Promise.resolve(); }
      };

      var pdfViewer = new window.pdfjsViewer.PDFSinglePageViewer({
        container: pdfContainer,
        viewer: pdfViewerEl,
        eventBus: viewerEventBus,
        linkService: pdfLinkService,
        findController: pdfFindController,
        textLayerMode: 1,
        annotationMode: 0,
        removePageBorders: true,
        l10n: nullL10n
      });
      pdfLinkService.setViewer(pdfViewer);

      var pdfDoc = null;
      var totalPages = 0;
      var currentPageNumber = 1;
      var pageDimsCache = [];
      var hoverQueued = false;
      var lastFindQuery = "";
      var useExactSearch = true;
      var pageSearchTextCache = [];
      var pageSearchLowerCache = [];
      var searchResults = [];
      var searchResultsTotal = 0;
      var activeSearchResultIndex = -1;
      var searchPageFirstGlobalIndex = [];
      var searchPageFirstStoredIndex = [];
      var searchPageMatchCount = [];
      var searchRunToken = 0;
      var pdfOutlineDestById = {};
      var searchDebounceTimer = 0;
      var SEARCH_INPUT_DEBOUNCE_MS = 140;
      var MAX_SEARCH_DROPDOWN_ROWS = 120;
      var ZOOM_MIN_SCALE = 0.5;
      var ZOOM_MAX_SCALE = 4.0;
      var ZOOM_STEP_FACTOR = 1.15;
      var manualZoomEnabled = false;
      var interactionMode = "drag";
      var sourceInspectorActive = false;
      var panDragActive = false;
      var panPointerId = null;
      var panStartX = 0;
      var panStartY = 0;
      var panStartLeft = 0;
      var panStartTop = 0;

      var lastWheelStepAt = 0;
      var wheelStepLock = false;
      var wheelUnlockTimer = 0;
      var WHEEL_STEP_COOLDOWN_MS = 110;
      var WHEEL_GESTURE_LOCK_MS = 220;

      var thumbDragging = false;
      var thumbDragOffsetY = 0;
      var trackHoldDirection = 0;
      var trackHoldDelayTimer = 0;
      var trackHoldRepeatTimer = 0;
      var TRACK_HOLD_DELAY_MS = 280;
      var TRACK_HOLD_REPEAT_MS = 70;
      var searchArrowHoldDirection = 0;
      var searchArrowHoldDelayTimer = 0;
      var searchArrowHoldRepeatTimer = 0;
      var searchArrowHoldDidRepeat = false;
      var searchArrowHoldPointerId = null;
      var suppressSearchArrowClick = false;
      var SEARCH_ARROW_HOLD_DELAY_MS = 250;
      var SEARCH_ARROW_HOLD_REPEAT_MS = 55;

      var highlightRestoreTimerA = 0;
      var highlightRestoreTimerB = 0;
      var highlightRestoreToken = 0;
      var highlightQueueTimer = 0;
      var highlightQueueToken = 0;

      function updatePageBadge(pageNumber) {
        var n = clamp(Number(pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        pageBadge.textContent = totalPages > 0 ? (n + " / " + totalPages) : String(n);
      }

      function emitPageChange(pageNumber) {
        var n = clamp(Number(pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        post("pdfjs-pagechange", { pageNumber: n, pageIndex: n - 1 });
      }

      function emitScroll(pageNumber) {
        var n = clamp(Number(pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        post("pdfjs-scroll", { pageNumber: n, pageIndex: n - 1 });
      }

      function emitHover(pageNumber) {
        var n = clamp(Number(pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        post("pdfjs-hover-page", { pageNumber: n, pageIndex: n - 1 });
      }

      function getCurrentPageView(pageNumber) {
        if (!pdfViewer || !pdfViewer.getPageView) return null;
        var idx = clamp((Number(pageNumber) || 1) - 1, 0, Math.max(0, totalPages - 1));
        return pdfViewer.getPageView(idx) || null;
      }

      function emitDimensions(pageNumber) {
        var n = clamp(Number(pageNumber) || currentPageNumber || 1, 1, Math.max(1, totalPages || 1));
        var w = Math.ceil(pdfContainer.clientWidth || 0);
        var h = Math.ceil(pdfContainer.clientHeight || 0);
        var pageView = getCurrentPageView(n);
        if (pageView) {
          if (pageView.viewport && pageView.viewport.width && pageView.viewport.height) {
            w = Math.ceil(pageView.viewport.width);
            h = Math.ceil(pageView.viewport.height);
          } else if (pageView.div) {
            var r = pageView.div.getBoundingClientRect();
            w = Math.ceil(r.width || w);
            h = Math.ceil(r.height || h);
          }
        }
        post("pdfjs-dimensions", {
          pageNumber: n,
          pageIndex: n - 1,
          pageHeight: h,
          pageWidth: w,
          containerHeight: Math.ceil(pdfContainer.clientHeight || 0),
          containerWidth: Math.ceil(pdfContainer.clientWidth || 0)
        });
      }

      function applyNativePageFit() {
        if (!pdfViewer) return;
        try {
          manualZoomEnabled = false;
          pdfViewer.currentScaleValue = "page-fit";
        } catch (e) {
          // ignore
        }
      }

      function getCurrentScaleValue() {
        var scale = Number(pdfViewer && pdfViewer.currentScale);
        if (!isFinite(scale) || scale <= 0) return 1;
        return scale;
      }

      function emitState(extra) {
        var payload = {
          pageNumber: currentPageNumber || 1,
          pageIndex: Math.max(0, (currentPageNumber || 1) - 1),
          totalPages: totalPages || 0,
          searchLabel: searchCount ? String(searchCount.textContent || "0/0") : "0/0",
          interactionMode: interactionMode || "highlight",
          sourceInspectorActive: !!sourceInspectorActive,
          scale: getCurrentScaleValue()
        };
        if (extra && typeof extra === "object") {
          for (var k in extra) {
            if (Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k];
          }
        }
        post("pdfjs-state", payload);
      }

      function normalizePdfOutlineItems(items, level, out) {
        out = out || [];
        var arr = Array.isArray(items) ? items : [];
        var baseLevel = Math.max(0, Math.floor(Number(level) || 0));
        for (var i = 0; i < arr.length; i++) {
          var item = arr[i] || {};
          var label = normalizeSearchText(item.title || item.label || "");
          if (label && item.dest) {
            var id = "pdf-outline-" + out.length;
            pdfOutlineDestById[id] = item.dest;
            out.push({
              id: id,
              label: label,
              level: baseLevel,
              kind: "toc"
            });
          }
          if (Array.isArray(item.items) && item.items.length) {
            normalizePdfOutlineItems(item.items, baseLevel + 1, out);
          }
        }
        return out;
      }

      function normalizePdfPageLabels(labels) {
        if (!Array.isArray(labels) || !labels.length) return [];
        return labels.map(function (label, idx) {
          return {
            id: "pdf-page-label-" + idx,
            label: normalizeSearchText(label || ("Page " + (idx + 1))),
            level: 0,
            kind: "pageList",
            pageIndex: idx
          };
        });
      }

      function publishPdfDocumentNav() {
        if (!pdfDoc) return;
        pdfOutlineDestById = {};
        Promise.all([
          (typeof pdfDoc.getOutline === "function" ? pdfDoc.getOutline() : Promise.resolve(null)).catch(function () { return null; }),
          (typeof pdfDoc.getPageLabels === "function" ? pdfDoc.getPageLabels() : Promise.resolve(null)).catch(function () { return null; })
        ]).then(function (values) {
          post("pdfjs-document-nav", {
            toc: normalizePdfOutlineItems(values[0] || [], 0, []),
            pageList: normalizePdfPageLabels(values[1] || [])
          });
        }).catch(function () {
          post("pdfjs-document-nav", { toc: [], pageList: [] });
        });
      }

      function goToOutlineItem(id) {
        var dest = pdfOutlineDestById[String(id || "")];
        if (!dest || !pdfLinkService || typeof pdfLinkService.goToDestination !== "function") return;
        Promise.resolve(pdfLinkService.goToDestination(dest)).then(function () {
          setTimeout(function () {
            currentPageNumber = pdfViewer ? (pdfViewer.currentPageNumber || currentPageNumber || 1) : currentPageNumber;
            updatePageBadge(currentPageNumber);
            updateNavigator();
            emitPageChange(currentPageNumber);
            emitScroll(currentPageNumber);
            emitDimensions(currentPageNumber);
            emitState();
          }, 80);
        }).catch(function (err) {
          post("pdfjs-error", { error: String((err && err.message) || err || "outline_navigation_failed") });
        });
      }

      function setManualZoom(nextScale) {
        if (!pdfViewer) return;
        var scale = clamp(Number(nextScale) || 1, ZOOM_MIN_SCALE, ZOOM_MAX_SCALE);
        try {
          manualZoomEnabled = true;
          pdfViewer.currentScale = scale;
          emitDimensions(currentPageNumber);
          emitState();
        } catch (e) {
          // ignore
        }
      }

      function zoomIn() {
        setManualZoom(getCurrentScaleValue() * ZOOM_STEP_FACTOR);
      }

      function zoomOut() {
        setManualZoom(getCurrentScaleValue() / ZOOM_STEP_FACTOR);
      }

      function resetZoom() {
        applyNativePageFit();
        emitDimensions(currentPageNumber);
        emitState();
      }

      function isDragMode() {
        return interactionMode === "drag";
      }

      function endPanDrag(ev) {
        if (!panDragActive) return;
        panDragActive = false;
        panPointerId = null;
        pdfContainer.classList.remove("dragging");
        if (pdfContainer && ev && typeof pdfContainer.releasePointerCapture === "function") {
          try { pdfContainer.releasePointerCapture(ev.pointerId); } catch (e) {}

          post("pdfjs-text-layer", { pageNumber: n, pageIndex: n - 1, error: "text_layer_unavailable" });
          return;
        }

        pdfDoc.getPage(n).then(function (page) {
          return page.getTextContent();
        }).then(function (textContent) {
          var items = Array.isArray(textContent.items) ? textContent.items : [];
          var plainText = items.map(function (it) {
            return (it && it.str) ? String(it.str) : "";
          }).join("");
          post("pdfjs-text-layer", {
            pageNumber: n,
            pageIndex: n - 1,
            plainText: plainText,
            innerHTML: "",
            layerClass: "textLayer",
            layerStyle: "",
            computedScaleFactor: 1,
            computedTotalScaleFactor: 1,
            viewportWidth: 0,
            viewportHeight: 0
          });
        }).catch(function () {
          post("pdfjs-text-layer", { pageNumber: n, pageIndex: n - 1, error: "text_layer_unavailable" });
        });
      }

      viewerEventBus.on("pagechanging", function (evt) {
        var n = clamp(Number(evt && evt.pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        currentPageNumber = n;
        updatePageBadge(n);
        updateNavigator();
        emitPageChange(n);
        emitScroll(n);
        emitDimensions(n);
        emitState();
        if (normalizeSearchText(searchInput ? searchInput.value : "") && searchResultsTotal > 0) {
          var active = (activeSearchResultIndex >= 0 && activeSearchResultIndex < searchResults.length)
            ? searchResults[activeSearchResultIndex]
            : null;
          if (!active || Number(active.pageNumber) !== n) {
            syncSearchPositionToPage(n);
          }
        }
        if (normalizeSearchText(searchInput ? searchInput.value : "")) {
          queueNativeHighlight(true, 18);
        }
      });

      viewerEventBus.on("textlayerrendered", function (evt) {
        if (!evt) return;
        var n = clamp(Number(evt.pageNumber) || 1, 1, Math.max(1, totalPages || 1));
        if (n !== currentPageNumber) return;
        if (!normalizeSearchText(searchInput ? searchInput.value : "")) return;
        queueNativeHighlight(true, 14);
      });

      viewerEventBus.on("pagesinit", function () {
        applyNativePageFit();
        emitDimensions(currentPageNumber || 1);
        emitState();
      });

      viewerEventBus.on("updatefindmatchescount", function (evt) {
        if (useExactSearch) return;
        var mc = evt && evt.matchesCount ? evt.matchesCount : {};
        setSearchCountLabel(mc.current, mc.total, mc.limit);
      });

      viewerEventBus.on("updatefindcontrolstate", function (evt) {
        if (useExactSearch) return;
        var state = Number(evt && evt.state);
        var mc = evt && evt.matchesCount ? evt.matchesCount : {};
        var findState = (window.pdfjsViewer && window.pdfjsViewer.FindState) || {};
        var NOT_FOUND = (typeof findState.NOT_FOUND === "number") ? findState.NOT_FOUND : 1;
        var PENDING = (typeof findState.PENDING === "number") ? findState.PENDING : 3;
        if (state === PENDING && searchCount && String(searchInput && searchInput.value || "").trim()) {
          searchCount.textContent = "...";
          searchCount.dataset.state = "pending";
          return;
        }
        setSearchCountLabel(mc.current, mc.total, mc.limit);
        if (!searchCount) return;
        if (state === NOT_FOUND && String(searchInput && searchInput.value || "").trim()) {
          searchCount.textContent = "No matches";
          searchCount.dataset.state = "no-results";
        }
      });

      function handleHover() {
        if (sourceInspectorActive) return;
        if (isDragMode()) return;
        if (hoverQueued) return;
        hoverQueued = true;
        requestAnimationFrame(function () {
          hoverQueued = false;
          emitHover(currentPageNumber);
        });
      }

      pdfContainer.addEventListener("mousemove", handleHover, { passive: true });
      pdfContainer.addEventListener("click", function () {
        if (sourceInspectorActive) return;
        if (isDragMode()) return;
        emitHover(currentPageNumber);
      }, true);

      pdfContainer.addEventListener("pointerdown", function (ev) {
        beginPanDrag(ev);
      });
      pdfContainer.addEventListener("pointermove", function (ev) {
        movePanDrag(ev);
      });
      pdfContainer.addEventListener("pointerup", function (ev) {
        endPanDrag(ev);
      });
      pdfContainer.addEventListener("pointercancel", function (ev) {
        endPanDrag(ev);
      });

      pdfContainer.addEventListener("wheel", function (ev) {
        if (sourceInspectorActive) return;
        if (isDragMode()) return;
        if (!totalPages) return;
        if (!ev || !isFinite(ev.deltaY) || ev.deltaY === 0) return;
        ev.preventDefault();
        clearTrackHold();
        if (wheelUnlockTimer) {
          clearTimeout(wheelUnlockTimer);
          wheelUnlockTimer = 0;
        }
        wheelUnlockTimer = setTimeout(function () {
          wheelStepLock = false;
          wheelUnlockTimer = 0;
        }, WHEEL_GESTURE_LOCK_MS);
        if (wheelStepLock) return;
        var now = Date.now();
        if ((now - lastWheelStepAt) < WHEEL_STEP_COOLDOWN_MS) return;
        lastWheelStepAt = now;
        wheelStepLock = true;
        stepPage(ev.deltaY > 0 ? 1 : -1);
      }, { passive: false });

      if (navPrev) {
        navPrev.addEventListener("click", function (ev) {
          ev.preventDefault();
          clearTrackHold();
          stepPage(-1);
        });
      }
      if (navNext) {
        navNext.addEventListener("click", function (ev) {
          ev.preventDefault();
          clearTrackHold();
          stepPage(1);
        });
      }

      if (navTrack) {
        navTrack.addEventListener("pointerdown", function (ev) {
          if (!totalPages) return;
          if (ev.button !== 0) return;
          ev.preventDefault();
          if (ev.target === navThumb) {
            beginThumbDrag(ev);
            return;
          }
          var thumbRect = navThumb.getBoundingClientRect();
          if (ev.clientY < thumbRect.top) {
            startTrackHold(-1);
          } else if (ev.clientY > thumbRect.bottom) {
            startTrackHold(1);
          } else {
            beginThumbDrag(ev);
          }
          if (typeof navTrack.setPointerCapture === "function") {
            try { navTrack.setPointerCapture(ev.pointerId); } catch (e) {}
          }
        });

        navTrack.addEventListener("pointermove", function (ev) {
          if (!thumbDragging) return;
          moveThumbDrag(ev);
        });

        navTrack.addEventListener("pointerup", function (ev) {
          clearTrackHold();
          if (typeof navTrack.releasePointerCapture === "function") {
            try { navTrack.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          endThumbDrag(ev);
        });

        navTrack.addEventListener("pointercancel", function (ev) {
          clearTrackHold();
          if (typeof navTrack.releasePointerCapture === "function") {
            try { navTrack.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          endThumbDrag(ev);
        });
      }

      window.addEventListener("pointerup", function (ev) {
        clearTrackHold();
        stopSearchArrowHold(ev && ev.pointerId);
        endPanDrag(ev);
      });
      window.addEventListener("pointercancel", function (ev) {
        clearTrackHold();
        stopSearchArrowHold(ev && ev.pointerId);
        endPanDrag(ev);
      });

      window.addEventListener("pointerdown", function (ev) {
        if (!searchDropdown || searchDropdown.hidden) return;
        var t = ev && ev.target;
        if (searchBar && searchBar.contains(t)) return;
        if (searchDropdown && searchDropdown.contains(t)) return;
        setSearchDropdownVisible(false);
      });

      if (zoomOutBtn) {
        zoomOutBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          zoomOut();
        });
      }
      if (zoomInBtn) {
        zoomInBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          zoomIn();
        });
      }
      if (zoomResetBtn) {
        zoomResetBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          resetZoom();
        });
      }
      if (modeToggleBtn) {
        modeToggleBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          setInteractionMode(isDragMode() ? "highlight" : "drag");
        });
      }
      setInteractionMode("drag");

      function queueExactSearch() {
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = 0;
        }
        var query = normalizeSearchText(searchInput ? searchInput.value : "");
        if (!query) {
          lastFindQuery = "";
          resetExactSearchUI();
          if (searchCount) {
            searchCount.textContent = "0/0";
            searchCount.dataset.state = "idle";
          }
          clearQueuedHighlightRefresh();
          clearPendingHighlightRestore();
          runFind("highlightallchange", false);
          return;
        }
        if (searchCount) {
          searchCount.textContent = "...";
          searchCount.dataset.state = "pending";
        }
        searchDebounceTimer = setTimeout(function () {
          searchDebounceTimer = 0;
          runExactSearch(query);
        }, SEARCH_INPUT_DEBOUNCE_MS);
      }

      function runExactSearchFromSubmit(_backward) {
        var query = normalizeSearchText(searchInput ? searchInput.value : "");
        if (!query) {
          lastFindQuery = "";
          resetExactSearchUI();
          if (searchCount) {
            searchCount.textContent = "0/0";
            searchCount.dataset.state = "idle";
          }
          clearQueuedHighlightRefresh();
          clearPendingHighlightRestore();
          runFind("highlightallchange", false);
          return;
        }
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = 0;
        }
        // Enter should only refresh the result list; it should not auto-jump.
        runExactSearch(query);
      }

      if (searchDropdownList) {
        searchDropdownList.addEventListener("click", function (ev) {
          var target = ev.target;
          var row = target && target.closest ? target.closest("button[data-result-index]") : null;
          if (!row) return;
          ev.preventDefault();
          var idx = Number(row.getAttribute("data-result-index"));
          if (!isFinite(idx)) return;
          focusSearchResult(idx, true);
        });
      }

      if (searchInput) {
        searchInput.addEventListener("input", function () {
          queueExactSearch();
        });
        searchInput.addEventListener("focus", function () {
          var query = normalizeSearchText(searchInput.value || "");
          if (!query) return;
          if (searchResults.length) {
            renderSearchDropdown(query);
            return;
          }
          queueExactSearch();
        });
        searchInput.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") {
            ev.preventDefault();
            runExactSearchFromSubmit(!!ev.shiftKey);
            return;
          }
          if (ev.key === "ArrowDown") {
            if (!searchResults.length) return;
            ev.preventDefault();
            stepSearchResult(1);
            return;
          }
          if (ev.key === "ArrowUp") {
            if (!searchResults.length) return;
            ev.preventDefault();
            stepSearchResult(-1);
            return;
          }
          if (ev.key === "Escape") {
            ev.preventDefault();
            setSearchDropdownVisible(false);
          }
        });
      }
      if (searchPrev) {
        searchPrev.addEventListener("pointerdown", function (ev) {
          if (!ev || ev.button !== 0) return;
          ev.preventDefault();
          clearTrackHold();
          startSearchArrowHold(-1, ev.pointerId);
          if (typeof searchPrev.setPointerCapture === "function") {
            try { searchPrev.setPointerCapture(ev.pointerId); } catch (e) {}
          }
        });
        searchPrev.addEventListener("pointerup", function (ev) {
          if (typeof searchPrev.releasePointerCapture === "function") {
            try { searchPrev.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          stopSearchArrowHold(ev && ev.pointerId);
        });
        searchPrev.addEventListener("pointercancel", function (ev) {
          if (typeof searchPrev.releasePointerCapture === "function") {
            try { searchPrev.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          stopSearchArrowHold(ev && ev.pointerId);
        });
        searchPrev.addEventListener("click", function (ev) {
          ev.preventDefault();
          if (suppressSearchArrowClick) {
            suppressSearchArrowClick = false;
            return;
          }
          clearTrackHold();
          stepSearchControls(-1);
        });
      }
      if (searchNext) {
        searchNext.addEventListener("pointerdown", function (ev) {
          if (!ev || ev.button !== 0) return;
          ev.preventDefault();
          clearTrackHold();
          startSearchArrowHold(1, ev.pointerId);
          if (typeof searchNext.setPointerCapture === "function") {
            try { searchNext.setPointerCapture(ev.pointerId); } catch (e) {}
          }
        });
        searchNext.addEventListener("pointerup", function (ev) {
          if (typeof searchNext.releasePointerCapture === "function") {
            try { searchNext.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          stopSearchArrowHold(ev && ev.pointerId);
        });
        searchNext.addEventListener("pointercancel", function (ev) {
          if (typeof searchNext.releasePointerCapture === "function") {
            try { searchNext.releasePointerCapture(ev.pointerId); } catch (e) {}
          }
          stopSearchArrowHold(ev && ev.pointerId);
        });
        searchNext.addEventListener("click", function (ev) {
          ev.preventDefault();
          if (suppressSearchArrowClick) {
            suppressSearchArrowClick = false;
            return;
          }
          clearTrackHold();
          stepSearchControls(1);
        });
      }
      if (searchClear) {
        searchClear.addEventListener("click", function (ev) {
          ev.preventDefault();
          if (searchDebounceTimer) {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = 0;
          }
          if (searchInput) searchInput.value = "";
          lastFindQuery = "";
          resetExactSearchUI();
          clearQueuedHighlightRefresh();
          clearPendingHighlightRestore();
          runFind("highlightallchange", false);
          if (searchCount) {
            searchCount.textContent = "0/0";
            searchCount.dataset.state = "idle";
          }
        });
      }

      window.addEventListener("resize", function () {
        if (!manualZoomEnabled) applyNativePageFit();
        updateNavigator();
        emitDimensions(currentPageNumber);
      });

      window.addEventListener("message", function (event) {
        if (event.origin !== appOrigin) return;
        var data = event.data || {};
        if (!data || data.source !== "reader-parent") return;
        if (String(data.sessionId || "") !== String(sessionId || "")) return;

        if (data.type === "pdfjs-command") {
          var action = String(data.action || "");
          if (action === "goToPage") {
            goToPage(Number(data.pageNumber) || 1, true);
            return;
          }
          if (action === "goToOutlineItem") {
            goToOutlineItem(data.id);
            return;
          }
          if (action === "nextPage") {
            stepPage(1);
            emitState();
            return;
          }
          if (action === "prevPage") {
            stepPage(-1);
            emitState();
            return;
          }
          if (action === "zoomIn") {
            zoomIn();
            return;
          }
          if (action === "zoomOut") {
            zoomOut();
            return;
          }
          if (action === "zoomReset") {
            resetZoom();
            return;
          }
          if (action === "toggleMode") {
            setInteractionMode(isDragMode() ? "highlight" : "drag");
            return;
          }
          if (action === "setMode") {
            setInteractionMode(String(data.mode || "") === "drag" ? "drag" : "highlight");
            return;
          }
          if (action === "setSourceInspector") {
            setSourceInspectorEnabled(!!data.enabled);
            return;
          }
          if (action === "search") {
            if (searchInput) searchInput.value = String(data.query || "");
            queueExactSearch();
            emitState();
            return;
          }
          if (action === "searchNext") {
            stepSearchControls(1);
            emitState();
            return;
          }
          if (action === "searchPrev") {
            stepSearchControls(-1);
            emitState();
            return;
          }
          if (action === "goToSearchResult") {
            focusSearchResult(Number(data.resultIndex) || 0, true, true);
            emitState();
            return;
          }
          if (action === "searchClear") {
            if (searchDebounceTimer) {
              clearTimeout(searchDebounceTimer);
              searchDebounceTimer = 0;
            }
            if (searchInput) searchInput.value = "";
            lastFindQuery = "";
            resetExactSearchUI();
            clearQueuedHighlightRefresh();
            clearPendingHighlightRestore();
            runFind("highlightallchange", false);
            if (searchCount) {
              searchCount.textContent = "0/0";
              searchCount.dataset.state = "idle";
            }
            emitState();
            return;
          }
          if (action === "getState") {
            emitState();
            return;
          }
        }

        if (data.type === "pdfjs-parent-resize") {
          if (!manualZoomEnabled) applyNativePageFit();
          updateNavigator();
          emitDimensions(currentPageNumber);
          return;
        }

        if (data.type === "pdfjs-set-page-dims-cache") {
          var arr = Array.isArray(data.pageDims) ? data.pageDims : [];
          pageDimsCache = arr;
          return;
        }

        if (data.type === "pdfjs-get-text-layer") {
          extractAndPostTextLayer(Number(data.pageNumber) || currentPageNumber || 1);
          return;
        }
      });

      var pdfSource = pdfUrl || ("/api/serve_pdf/" + encodeURIComponent(cacheId));
      var loadingTask = window.pdfjsLib.getDocument(pdfSource);
      loadingTask.promise.then(function (doc) {
        pdfDoc = doc;
        totalPages = Number(doc.numPages) || 0;
        pageSearchTextCache = [];
        pageSearchLowerCache = [];
        searchResults = [];
        searchResultsTotal = 0;
        activeSearchResultIndex = -1;
        searchPageFirstGlobalIndex = [];
        searchPageFirstStoredIndex = [];
        searchPageMatchCount = [];
        searchRunToken++;
        if (searchDropdownMeta) searchDropdownMeta.textContent = "Type to search";
        if (searchDropdownList) searchDropdownList.innerHTML = "";
        setSearchDropdownVisible(false);
        if (totalPages < 1) {
          post("pdfjs-error", { error: "pdf_no_pages" });
          return;
        }

        pdfViewer.setDocument(pdfDoc);
        pdfLinkService.setDocument(pdfDoc, null);
        pdfFindController.setDocument(pdfDoc);
        publishPdfDocumentNav();

        currentPageNumber = 1;
        updatePageBadge(1);
        updateNavigator();

        applyNativePageFit();

        post("pdfjs-ready", { numPages: totalPages });
        emitPageChange(1);
        emitScroll(1);
        emitDimensions(1);
        emitState();
      }).catch(function (err) {
        post("pdfjs-error", { error: String((err && err.message) || err || "pdf_load_failed") });
      });
    })();
  </script>
</body>
</html>
